<h2>Favoritos</h2>
<div class="contenedorcard">
  <mat-card class="card" *ngFor="let producto of coleccionFavoritos">
    <mat-card-header class="card-header">
      <mat-card-title>{{producto.nombre}}</mat-card-title>
    </mat-card-header>
    <img mat-card-image class="card-img" [src]="producto.imagen" [alt]="producto.alt || 'Imagen del producto'" />
    <mat-card-content class="card-descripcion">
      <p>Precio: {{producto.precio | currency}}</p>
    </mat-card-content>
    <mat-card-actions class="card-botones">
      <button (click)="subirFavorito(producto)" mat-icon-button color="primary">
        <mat-icon *ngIf="producto.favoritos">favorite</mat-icon>
        <mat-icon *ngIf="!producto.favoritos">favorite_border</mat-icon>
      </button>
    </mat-card-actions>
  </mat-card>
</div>
