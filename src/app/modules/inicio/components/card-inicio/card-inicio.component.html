<div class="container">
    <div class="row">
        <h2>elementos destacados:</h2>

        <div class="col">
            <div *ngFor="let i of info" class="contenido "  >
                <mat-card class="example-card card">
                    <mat-card-header>
                        <mat-card-title>{{i.nombre}}</mat-card-title>
                    </mat-card-header>
                    <img mat-card-image src="{{i.imagen}}" alt="{{i.alt}}" class="img-card">
                    <mat-card-content>
                        <p>
                        </p>
                    </mat-card-content>
                    <mat-card-actions>
                        <!-- Botón "Ver más" -->
                        <button type="button" class="btn1 btn-primary" data-bs-toggle="modal"
                            data-bs-target="#exampleModal">
                            Ver más
                        </button>
                      
                    </mat-card-actions>
                </mat-card>
            </div>
        </div>
    </div>
</div>
