
<div class="container">

    <h1 class="titulo">Inicio de Sesión</h1>


    <div class="row">

        <!-- Email -->
        <div class="form-floating mb-3">
            <input type="email" class="form-control" id="floatingInput" placeholder="Correo Electrónico"
                [(ngModel)]="usuarios.email">
            <label for="floatingInput">Correo Electrónico</label>
            <div class="icon-container">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                    fill="#b09e8a">
                    <path
                        d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Z" />
                </svg>
            </div>
        </div>

    <!-- Contraseña -->
<div class="form-floating">
    <input [type]="passwordVisible ? 'text' : 'password'" class="form-control" id="floatingPassword" placeholder="Contraseña"
        [(ngModel)]="usuarios.password">
    <label for="floatingPassword">Contraseña</label>
    <div class="icon-container" (click)="togglePasswordVisibility()">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
            fill="#b09e8a">
            <path
                d="M160-80v-560h120v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h120v560H160Zm320-200q33 0 56.5-23.5T560-360q0-33-23.5-56.5T480-440q-33 0-56.5 23.5T400-360q0 33 23.5 56.5T480-280ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80Z" />
        </svg>

    </div>
</div> 

        <!-- Botón para iniciar sesión -->
        <button class="boton" (click)="IniciarSesion()">Iniciar Sesión</button>

        <!-- Ir a registrarse -->
        <div id="Registrarse" class="container-pregunta">
            <h2>
                ¿No estás registrado aún? <div class="btn" routerLink="/registro"> Registrarse.</div>
            </h2>
        </div>


    </div>

</div>
