<mat-toolbar class="custom-toolbar">
    <!-- Menú de inicio -->
    <button id="menuInicio" mat-button routerLink="/inicio" class="toolbar-button">Inicio</button>

    <!-- Menú desplegable: SECCIÓN DE PRODUCTOS -->
    <button id="menuProducto" mat-button [matMenuTriggerFor]="producto" class="toolbar-button">Categorías</button>
    <mat-menu #producto="matMenu">
        <button mat-menu-item routerLink="/producto">Kayak</button>
        <button mat-menu-item routerLink="/indumentaria">Escalada</button>
        <button mat-menu-item routerLink="/alimentacion">Pesca</button>
        <button mat-menu-item routerLink="/juguetes">Ciclismo</button>
        <button mat-menu-item routerLink="/juguetes">Esqui</button>
        <button mat-menu-item routerLink="/juguetes">Buceo</button>
        <button mat-menu-item routerLink="/juguetes">Tirolesa</button>
        <button mat-menu-item routerLink="/juguetes">Paracaidismo</button>
        <button mat-menu-item routerLink="/juguetes">Alpinismo</button>
    </mat-menu>

    <!-- Logo -->
    <div class="logo-container">
        <a class="navbar-brand" href="#">
            <img src="../../../../../../assets/logo.jpg" alt="Logo" class="logo-image">
        </a>
    </div>

    <span class="example-spacer"></span>

    <!-- Botones del navbar -->
    <div>
        <!-- Manejo del inicio (registro e inicio de sesión) y del cerrar sesión -->
        <button class="btn" [matMenuTriggerFor]="usuario">
            <mat-icon>person</mat-icon> <!-- Icono del user-->
        </button>

        <mat-menu #usuario="matMenu">
            <button mat-menu-item *ngIf="logueado" routerLink="/registro"
                class="custom-menu-button">Registrarse</button>
            <button mat-menu-item *ngIf="logueado" routerLink="/inicio-sesion" class="custom-menu-button">Iniciar
                sesión</button>
        </mat-menu>


        <!-- Icono del carrito -->
        <button routerLink="/carrito" mat-icon-button  aria-label="icon-button with buy icon" matBadge="{{productoservicio.cantidadProductosCarrito}}" matBadgeOverlap="false" class="demo-section">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-cart" viewBox="0 0 16 16">
                <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
              </svg>
          </button>


        <button routerLink="/favorito" mat-icon-button class="favorite-icon" aria-label="icon-button with heart icon">
            <mat-icon matBadge="{{productoservicio.cantidadProductosFavoritos}}"  matBadgeColor="warn">favorite</mat-icon>
          </button>

    </div>
</mat-toolbar>
